services:
  - type: web
    name: hms-backend
    env: node
    buildCommand: cd backend && npm install
    startCommand: cd backend && npm start
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: hms-postgres
          property: connectionString
      - key: PORT
        value: 5000
      - key: JWT_SECRET
        generateValue: true

  - type: web
    name: hms-frontend
    env: static
    buildCommand: ""
    staticPublishPath: ./frontend
    # Note: Render static sites do not support nginx inverse proxy natively. 
    # For a real public link using this Render config, the frontend API url needs to explicitly hit the hms-backend render URL.
    # Therefore, we use Rewrites to emulate NGINX!
    routes:
      - type: rewrite
        source: /api/*
        destination: https://hms-backend.onrender.com/api/*
      - type: rewrite
        source: /*
        destination: /index.html

databases:
  - type: postgres
    name: hms-postgres
    databaseName: hospital_db
    user: postgres
    # The schema.sql will need to be applied manually via psql or automated script, 
    # but Render starts the database successfully. 
