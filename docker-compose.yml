version: '3.8'

services:
  db:
    image: postgres:15
    container_name: hms_db
    restart: always
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: rootpassword
      POSTGRES_DB: hospital_db
    ports:
      - "5432:5432"
    volumes:
      - ./database/schema.sql:/docker-entrypoint-initdb.d/schema.sql

  backend:
    build: ./backend
    container_name: hms_backend
    restart: always
    ports:
      - "5000:5000"
    environment:
      DB_HOST: db
      DB_PORT: 5432
      DB_USER: postgres
      DB_PASSWORD: rootpassword
      DB_NAME: hospital_db
      PORT: 5000
      JWT_SECRET: medicore_super_secret_jwt_key_2026
      FRONTEND_URL: http://localhost:3000
    depends_on:
      - db

  frontend:
    build: ./frontend
    container_name: hms_frontend
    restart: always
    ports:
      - "3000:80"
