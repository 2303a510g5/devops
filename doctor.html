<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width,initial-scale=1.0"/>
<title>MediCore — Doctor Dashboard</title>
<link rel="stylesheet" href="../css/style.css"/>
</head>
<body>
<div class="layout">
  <aside class="sidebar">
    <div class="sidebar-brand">
      <div class="sidebar-brand-icon">M</div>
      <span class="sidebar-brand-name">MediCore</span>
    </div>
    <nav class="sidebar-nav">
      <div class="nav-section">Practice</div>
      <button class="nav-item active" data-page="today"><span class="nav-icon">🏠</span>Today's Schedule</button>
      <button class="nav-item" data-page="appointments"><span class="nav-icon">📅</span>All Appointments</button>
      <button class="nav-item" data-page="patients"><span class="nav-icon">👥</span>My Patients</button>
      <div class="nav-section">Records</div>
      <button class="nav-item" data-page="prescriptions"><span class="nav-icon">💊</span>Prescriptions</button>
      <div class="nav-section">Account</div>
      <button class="nav-item" data-page="profile"><span class="nav-icon">👤</span>My Profile</button>
    </nav>
    <div class="sidebar-footer">
      <div class="sidebar-user">
        <div class="sidebar-avatar" id="sbAvatar">D</div>
        <div style="flex:1;min-width:0">
          <div class="sidebar-user-name" id="sbName">Doctor</div>
          <div class="sidebar-user-role" id="sbSpec">Specialist</div>
        </div>
        <button class="sidebar-logout" onclick="logout()" title="Logout">⏻</button>
      </div>
    </div>
  </aside>

  <div class="main">
    <header class="topbar">
      <span id="pageTitle" style="font-size:16px;font-weight:600">Today's Schedule</span>
      <div class="topbar-right">
        <span class="topbar-user" id="tbUser"></span>
        <span class="role-pill role-pill-doctor">Doctor</span>
      </div>
    </header>
    <main class="page-body" id="pageBody"><div class="spinner"></div></main>
  </div>
</div>

<!-- Prescription Modal -->
<div id="rxModal" style="display:none;position:fixed;inset:0;background:rgba(0,0,0,.5);z-index:200;display:none;align-items:center;justify-content:center;padding:20px">
  <div style="background:white;border-radius:16px;width:100%;max-width:580px;max-height:90vh;overflow-y:auto">
    <div style="display:flex;align-items:center;justify-content:space-between;padding:18px 24px;border-bottom:1px solid var(--border)">
      <h3 style="font-size:17px;font-weight:700">Write Prescription</h3>
      <button onclick="closeRx()" style="background:none;border:none;font-size:20px;cursor:pointer;color:var(--text2)">✕</button>
    </div>
    <div style="padding:20px 24px">
      <input type="hidden" id="rxApptId"/>
      <div class="form-group"><label>Diagnosis *</label><textarea id="rxDiagnosis" placeholder="Primary diagnosis..." rows="2"></textarea></div>
      <div style="margin-bottom:14px">
        <div style="display:flex;align-items:center;justify-content:space-between;margin-bottom:8px">
          <label style="font-size:12px;font-weight:600;color:var(--text2)">Medications</label>
          <button class="btn btn-outline btn-sm" onclick="addMedRow()">+ Add Medicine</button>
        </div>
        <div id="medRows"></div>
      </div>
      <div class="form-grid">
        <div class="form-group"><label>Instructions</label><textarea id="rxInstructions" rows="2" placeholder="Rest, diet, etc."></textarea></div>
        <div class="form-group"><label>Follow-up Date</label><input type="date" id="rxFollowUp"/></div>
      </div>
      <div class="alert alert-error" id="rxErr"></div>
    </div>
    <div style="display:flex;justify-content:flex-end;gap:10px;padding:14px 24px;border-top:1px solid var(--border)">
      <button class="btn btn-outline" onclick="closeRx()">Cancel</button>
      <button class="btn btn-primary" id="rxSaveBtn" onclick="savePrescription()">Save Prescription</button>
    </div>
  </div>
</div>

<div class="toast" id="globalToast"></div>

<script src="../js/api.js"></script>
<script>
let user = null;

(async function() {
  user = requireAuth('doctor');
  if (!user) return;
  document.getElementById('sbAvatar').textContent = user.name[0].toUpperCase();
  document.getElementById('sbName').textContent   = user.name;
  document.getElementById('sbSpec').textContent   = user.specialization || 'Doctor';
  document.getElementById('tbUser').textContent   = user.name;
  document.querySelectorAll('.nav-item').forEach(b => b.addEventListener('click', () => navigate(b.dataset.page)));
  navigate('today');
})();

function navigate(page) {
  document.querySelectorAll('.nav-item').forEach(b => b.classList.toggle('active', b.dataset.page === page));
  const titles = { today:"Today's Schedule", appointments:'All Appointments', patients:'My Patients', prescriptions:'Prescriptions', profile:'My Profile' };
  document.getElementById('pageTitle').textContent = titles[page] || page;
  PAGES[page]?.();
}

const PAGES = {
  async today() {
    const pb = document.getElementById('pageBody');
    pb.innerHTML = '<div class="spinner"></div>';
    try {
      const res = await Doctors.appointments(user.id);
      const all = res.data;
      pb.innerHTML = `
        <div class="welcome-banner">
          <div class="wb-text"><h3>Good morning, ${user.name}!</h3><p>${user.specialization} · ${new Date().toLocaleDateString('en-IN',{weekday:'long',day:'numeric',month:'long'})}</p></div>
          <div class="wb-icon">⚕️</div>
        </div>
        <div class="stats-grid" style="grid-template-columns:repeat(4,1fr)">
          <div class="stat-card"><div class="stat-icon si-blue">📅</div><div><div class="stat-value">${all.length}</div><div class="stat-label">Total</div></div></div>
          <div class="stat-card"><div class="stat-icon si-amber">⏳</div><div><div class="stat-value">${all.filter(a=>a.status==='pending').length}</div><div class="stat-label">Pending</div></div></div>
          <div class="stat-card"><div class="stat-icon si-teal">✅</div><div><div class="stat-value">${all.filter(a=>a.status==='confirmed').length}</div><div class="stat-label">Confirmed</div></div></div>
          <div class="stat-card"><div class="stat-icon si-green">🏁</div><div><div class="stat-value">${all.filter(a=>a.status==='completed').length}</div><div class="stat-label">Completed</div></div></div>
        </div>
        <div class="card"><div class="card-header"><span class="card-title">Schedule</span></div>
        ${all.length ? `<div class="table-wrap"><table>
          <thead><tr><th>Time</th><th>Patient</th><th>Blood</th><th>Reason</th><th>Status</th><th>Action</th></tr></thead>
          <tbody>${all.map(a=>`<tr>
            <td><strong>${a.appointment_time?.slice(0,5)}</strong><br><small style="color:var(--text3)">${formatDate(a.appointment_date)}</small></td>
            <td>${a.patient_name}<br><small style="color:var(--text2)">${a.patient_phone||''}</small></td>
            <td><span class="badge badge-confirmed">${a.blood_group||'—'}</span></td>
            <td style="max-width:130px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap">${a.reason||'Consultation'}</td>
            <td>${badge(a.status)}</td>
            <td style="display:flex;gap:6px;flex-wrap:wrap">
              ${a.status==='pending'   ? `<button class="btn btn-outline btn-sm" onclick="updateStatus(${a.id},'confirmed')">✅ Confirm</button>` : ''}
              ${a.status==='confirmed' ? `<button class="btn btn-primary btn-sm" onclick="updateStatus(${a.id},'completed')">✔ Complete</button>` : ''}
              ${a.status==='completed' ? `<button class="btn btn-outline btn-sm" onclick="openRx(${a.id})">💊 Prescribe</button>` : ''}
            </td>
          </tr>`).join('')}</tbody></table></div>`
        : `<div class="empty-state"><div class="empty-icon">📅</div><div class="empty-title">No appointments yet</div></div>`}
        </div>`;
    } catch(err) { document.getElementById('pageBody').innerHTML = `<div class="alert alert-error" style="display:block">${err.message}</div>`; }
  },

  async appointments() {
    const pb = document.getElementById('pageBody');
    pb.innerHTML = '<div class="spinner"></div>';
    try {
      const res = await Doctors.appointments(user.id);
      pb.innerHTML = `<div class="card"><div class="card-header"><span class="card-title">All Appointments (${res.data.length})</span></div>
        ${res.data.length ? `<div class="table-wrap"><table>
          <thead><tr><th>Date & Time</th><th>Patient</th><th>Reason</th><th>Status</th><th>Fee</th></tr></thead>
          <tbody>${res.data.map(a=>`<tr>
            <td>${formatDate(a.appointment_date)}<br><small style="color:var(--text2)">${a.appointment_time?.slice(0,5)}</small></td>
            <td>${a.patient_name}</td>
            <td style="max-width:160px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap">${a.reason||'—'}</td>
            <td>${badge(a.status)}</td>
            <td>—</td>
          </tr>`).join('')}</tbody></table></div>`
        : `<div class="empty-state"><div class="empty-icon">📅</div><div class="empty-title">No appointments yet</div></div>`}
        </div>`;
    } catch(err) { document.getElementById('pageBody').innerHTML = `<div class="alert alert-error" style="display:block">${err.message}</div>`; }
  },

  async patients() {
    const pb = document.getElementById('pageBody');
    pb.innerHTML = '<div class="spinner"></div>';
    try {
      const res = await Doctors.appointments(user.id);
      const seen = {};
      res.data.forEach(a => {
        if (!seen[a.patient_id]) seen[a.patient_id] = { name: a.patient_name, phone: a.patient_phone, blood: a.blood_group, visits: 0, last: a.appointment_date };
        seen[a.patient_id].visits++;
      });
      const patients = Object.values(seen);
      pb.innerHTML = `<div class="card"><div class="card-header"><span class="card-title">My Patients (${patients.length})</span></div>
        ${patients.length ? `<div class="table-wrap"><table>
          <thead><tr><th>Name</th><th>Phone</th><th>Blood Group</th><th>Total Visits</th><th>Last Visit</th></tr></thead>
          <tbody>${patients.map(p=>`<tr>
            <td><strong>${p.name}</strong></td><td>${p.phone||'—'}</td>
            <td><span class="badge badge-confirmed">${p.blood||'—'}</span></td>
            <td>${p.visits}</td><td>${formatDate(p.last)}</td>
          </tr>`).join('')}</tbody></table></div>`
        : `<div class="empty-state"><div class="empty-icon">👥</div><div class="empty-title">No patients yet</div></div>`}
        </div>`;
    } catch(err) { document.getElementById('pageBody').innerHTML = `<div class="alert alert-error" style="display:block">${err.message}</div>`; }
  },

  async prescriptions() {
    const pb = document.getElementById('pageBody');
    pb.innerHTML = '<div class="spinner"></div>';
    pb.innerHTML = `<div class="card"><div class="card-header"><span class="card-title">Prescriptions</span></div>
      <div class="card-body"><div class="empty-state"><div class="empty-icon">💊</div><div class="empty-title">Complete an appointment</div><div class="empty-sub">Then click "Prescribe" to write a prescription</div></div></div></div>`;
  },

  async profile() {
    const pb = document.getElementById('pageBody');
    pb.innerHTML = '<div class="spinner"></div>';
    try {
      const res = await Doctors.get(user.id);
      const d = res.data;
      pb.innerHTML = `<div class="card" style="max-width:520px"><div class="card-header"><span class="card-title">My Profile</span></div><div class="card-body">
        <div class="profile-header">
          <div class="profile-avatar" style="background:var(--teal)">${d.name.split(' ').pop()[0]}</div>
          <div><div class="profile-name">${d.name}</div><div class="profile-email">${d.email}</div>
          <span class="badge badge-active" style="margin-top:6px;display:inline-flex">${d.specialization}</span></div>
        </div>
        <div class="form-grid">
          <div class="form-group"><label>Full Name</label><input id="dName" value="${d.name||''}"/></div>
          <div class="form-group"><label>Phone</label><input id="dPhone" value="${d.phone||''}"/></div>
          <div class="form-group"><label>Specialization</label><input id="dSpec" value="${d.specialization||''}"/></div>
          <div class="form-group"><label>Qualification</label><input id="dQual" value="${d.qualification||''}"/></div>
          <div class="form-group"><label>Experience (Years)</label><input type="number" id="dExp" value="${d.experience_years||0}"/></div>
          <div class="form-group"><label>Consultation Fee (₹)</label><input type="number" id="dFee" value="${d.consultation_fee||0}"/></div>
        </div>
        <div id="profMsg" class="alert"></div>
        <button class="btn btn-primary" onclick="saveProfile()">Save Changes</button>
      </div></div>`;
    } catch(err) { document.getElementById('pageBody').innerHTML = `<div class="alert alert-error" style="display:block">${err.message}</div>`; }
  },
};

async function updateStatus(id, status) {
  try {
    await Appointments.status(id, { status });
    showToast('Appointment updated to ' + status);
    navigate('today');
  } catch(err) { showToast(err.message, 'error'); }
}

function openRx(apptId) {
  document.getElementById('rxApptId').value = apptId;
  document.getElementById('rxDiagnosis').value = '';
  document.getElementById('rxInstructions').value = '';
  document.getElementById('rxFollowUp').value = '';
  document.getElementById('medRows').innerHTML = '';
  document.getElementById('rxErr').style.display = 'none';
  addMedRow();
  document.getElementById('rxModal').style.display = 'flex';
}
function closeRx() { document.getElementById('rxModal').style.display = 'none'; }

function addMedRow() {
  const div = document.createElement('div');
  div.style.cssText = 'display:grid;grid-template-columns:2fr 1fr 1fr 1fr auto;gap:8px;margin-bottom:8px;align-items:center';
  div.innerHTML = `
    <input class="med-n" placeholder="Medicine name" style="padding:8px;border:1px solid var(--border);border-radius:6px;font-size:13px;font-family:inherit"/>
    <input class="med-d" placeholder="Dosage"     style="padding:8px;border:1px solid var(--border);border-radius:6px;font-size:13px;font-family:inherit"/>
    <input class="med-f" placeholder="Frequency"  style="padding:8px;border:1px solid var(--border);border-radius:6px;font-size:13px;font-family:inherit"/>
    <input class="med-u" placeholder="Duration"   style="padding:8px;border:1px solid var(--border);border-radius:6px;font-size:13px;font-family:inherit"/>
    <button onclick="this.parentElement.remove()" style="background:var(--red-l);color:#7f1d1d;border:none;border-radius:6px;padding:8px 10px;cursor:pointer;font-size:13px">✕</button>`;
  document.getElementById('medRows').appendChild(div);
}

async function savePrescription() {
  const apptId   = document.getElementById('rxApptId').value;
  const diagnosis= document.getElementById('rxDiagnosis').value.trim();
  const errEl    = document.getElementById('rxErr');
  errEl.style.display = 'none';
  if (!diagnosis) { errEl.textContent = 'Diagnosis is required.'; errEl.style.display = 'block'; return; }

  const meds = Array.from(document.querySelectorAll('#medRows > div')).map(row => ({
    name:      row.querySelector('.med-n').value,
    dosage:    row.querySelector('.med-d').value,
    frequency: row.querySelector('.med-f').value,
    duration:  row.querySelector('.med-u').value,
  })).filter(m => m.name.trim());

  const btn = document.getElementById('rxSaveBtn');
  btn.disabled = true; btn.textContent = 'Saving...';
  try {
    await Prescriptions.create({
      appointment_id: parseInt(apptId),
      diagnosis,
      medications: meds,
      instructions: document.getElementById('rxInstructions').value,
      follow_up_date: document.getElementById('rxFollowUp').value || null,
    });
    closeRx();
    showToast('Prescription saved successfully!');
    navigate('today');
  } catch(err) {
    errEl.textContent = err.message; errEl.style.display = 'block';
  } finally {
    btn.disabled = false; btn.textContent = 'Save Prescription';
  }
}

async function saveProfile() {
  const msgEl = document.getElementById('profMsg');
  try {
    await Doctors.update(user.id, {
      name:             document.getElementById('dName').value,
      phone:            document.getElementById('dPhone').value,
      specialization:   document.getElementById('dSpec').value,
      qualification:    document.getElementById('dQual').value,
      experience_years: document.getElementById('dExp').value,
      consultation_fee: document.getElementById('dFee').value,
    });
    msgEl.textContent = '✓ Profile saved!'; msgEl.className = 'alert alert-success'; msgEl.style.display = 'block';
    setTimeout(() => { msgEl.style.display = 'none'; }, 3000);
  } catch(err) {
    msgEl.textContent = err.message; msgEl.className = 'alert alert-error'; msgEl.style.display = 'block';
  }
}
</script>
</body>
</html>
