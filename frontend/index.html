<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width,initial-scale=1.0"/>
<title>MediCore HMS — Login</title>
<link rel="stylesheet" href="css/login.css"/>
</head>
<body>
<div class="auth-wrap">
  <!-- LEFT -->
  <div class="auth-left">
    <div class="auth-brand">
      <div class="auth-brand-icon">M</div>
      <span class="auth-brand-name">MediCore HMS</span>
    </div>
    <div>
      <h1 class="auth-title">Modern<br><em>Healthcare</em><br>Management</h1>
      <p class="auth-sub">A unified platform for patients, doctors, and administrators. Streamlined. Secure. Smart.</p>
    </div>
    <div class="auth-stats">
      <div><div class="hs-num">10k+</div><div class="hs-lbl">Patients</div></div>
      <div><div class="hs-num">200+</div><div class="hs-lbl">Doctors</div></div>
      <div><div class="hs-num">99.9%</div><div class="hs-lbl">Uptime</div></div>
    </div>
    <div class="deco">
      <div class="deco-ring" style="width:260px;height:260px"></div>
      <div class="deco-ring" style="width:430px;height:430px;border-color:rgba(45,212,191,.05)"></div>
    </div>
  </div>

  <!-- RIGHT -->
  <div class="auth-right">
    <div class="auth-card">
      <div class="auth-card-title">Sign In</div>
      <div class="auth-card-sub">Choose your role and enter credentials</div>

      <div class="role-tabs" id="roleTabs">
        <button class="role-tab active" data-role="patient">Patient</button>
        <button class="role-tab" data-role="doctor">Doctor</button>
        <button class="role-tab" data-role="admin">Admin</button>
      </div>

      <div class="alert-box alert-box-error" id="loginErr"></div>

      <div class="form-group">
        <label>Email Address</label>
        <input type="email" id="email" placeholder="you@example.com" autocomplete="off"/>
      </div>
      <div class="form-group">
        <label>Password</label>
        <div class="pw-wrap">
          <input type="password" id="password" placeholder="••••••••" autocomplete="off"/>
          <button class="pw-toggle" id="pwToggle">👁</button>
        </div>
      </div>

      <button class="btn-auth" id="loginBtn">Sign In</button>

      <div class="link-row">New patient? <a id="goRegister">Create account →</a></div>

      <div class="demo-box">
        <div class="demo-lbl">Quick Demo Login</div>
        <div class="demo-btns">
          <button class="demo-btn" data-email="admin@hospital.com"        data-pass="Admin@123"   data-role="admin">Admin</button>
          <button class="demo-btn" data-email="priya.sharma@hospital.com" data-pass="Doctor@123"  data-role="doctor">Doctor</button>
          <button class="demo-btn" data-email="amit.singh@email.com"      data-pass="Patient@123" data-role="patient">Patient</button>
        </div>
      </div>
    </div>
  </div>
</div>

<script src="js/api.js"></script>
<script>
let selRole = 'patient';

// Role tabs
document.querySelectorAll('.role-tab').forEach(b => {
  b.addEventListener('click', () => {
    selRole = b.dataset.role;
    document.querySelectorAll('.role-tab').forEach(x => x.classList.remove('active'));
    b.classList.add('active');
  });
});

// Password toggle
document.getElementById('pwToggle').addEventListener('click', () => {
  const p = document.getElementById('password');
  p.type = p.type === 'password' ? 'text' : 'password';
});

// Demo buttons
document.querySelectorAll('.demo-btn').forEach(b => {
  b.addEventListener('click', () => {
    selRole = b.dataset.role;
    document.querySelectorAll('.role-tab').forEach(x => x.classList.toggle('active', x.dataset.role === selRole));
    document.getElementById('email').value    = b.dataset.email;
    document.getElementById('password').value = b.dataset.pass;
    document.getElementById('loginErr').style.display = 'none';
  });
});

// Register link
document.getElementById('goRegister').addEventListener('click', () => {
  window.location.href = 'pages/register.html';
});

// Login
document.getElementById('loginBtn').addEventListener('click', async () => {
  const email    = document.getElementById('email').value.trim();
  const password = document.getElementById('password').value;
  const errEl    = document.getElementById('loginErr');
  const btn      = document.getElementById('loginBtn');

  errEl.style.display = 'none';
  if (!email || !password) { errEl.textContent = 'Please enter email and password.'; errEl.style.display = 'block'; return; }

  btn.disabled = true; btn.textContent = 'Signing in...';
  try {
    const res = await Auth.login({ email, password, role: selRole });
    token.set(res.token);
    session.set(res.user);
    const redirect = { admin:'pages/admin.html', doctor:'pages/doctor.html', patient:'pages/patient.html' };
    window.location.href = redirect[res.user.role];
  } catch (err) {
    errEl.textContent = err.message;
    errEl.style.display = 'block';
    document.getElementById('password').value = '';
  } finally {
    btn.disabled = false; btn.textContent = 'Sign In';
  }
});

// Already logged in?
(function() {
  const u = session.get(); const t = token.get();
  if (u && t) {
    const r = { admin:'pages/admin.html', doctor:'pages/doctor.html', patient:'pages/patient.html' };
    window.location.href = r[u.role] || 'pages/patient.html';
  }
})();
</script>
</body>
</html>
